          <rect x="160" width="8" rx="1"><animate attributeName="height" values="20;8;24;10;20"  dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="206;218;202;216;206" dur="1.1s" repeatCount="indefinite"/></rect>
          <rect x="174" width="8" rx="1"><animate attributeName="height" values="12;26;8;22;12"  dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="214;200;218;204;214" dur="1.5s" repeatCount="indefinite"/></rect>
          <rect x="188" width="8" rx="1"><animate attributeName="height" values="26;10;20;8;26"  dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="200;216;206;218;200" dur="1.2s" repeatCount="indefinite"/></rect>

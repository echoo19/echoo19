        <rect x="37"  y="296" width="11" height="11" fill="#3d3d3d"/>
        <rect x="50"  y="296" width="11" height="11" fill="#525252"/>
        <rect x="63"  y="296" width="11" height="11" fill="#6a6a6a"/>
        <rect x="76"  y="296" width="11" height="11" fill="#858585"/>
